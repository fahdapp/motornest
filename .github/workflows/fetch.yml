name: fetch-media
on:
  push:
    branches: [media-fetch]
    paths: [fetch.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p media
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL -A "MotorNestBot/1.0 (advert, dealer stock with permission)" -o "media/$name" "$url" || echo "failed $name"
          done < fetch.txt
          ls -la media
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add media
          git commit -m "Fetched media" || true
          git push
